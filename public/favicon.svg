<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background subtle glow -->
  <rect width="64" height="64" rx="14" fill="#0A0A0A"></rect>

  <!-- Outer circuit ring -->
  <circle cx="32" cy="32" r="20" stroke="hsl(185, 100%, 50%)" stroke-width="2" opacity="0.9"></circle>

  <!-- Inner core -->
  <circle cx="32" cy="32" r="6" fill="hsl(185, 100%, 50%)"></circle>

  <!-- Circuit nodes -->
  <circle cx="32" cy="12" r="2" fill="hsl(185, 100%, 50%)"></circle>
  <circle cx="52" cy="32" r="2" fill="hsl(185, 100%, 50%)"></circle>
  <circle cx="32" cy="52" r="2" fill="hsl(185, 100%, 50%)"></circle>
  <circle cx="12" cy="32" r="2" fill="hsl(185, 100%, 50%)"></circle>

  <!-- Connecting lines -->
  <line x1="32" y1="18" x2="32" y2="14" stroke="hsl(185, 100%, 50%)" stroke-width="2"></line>
  <line x1="46" y1="32" x2="50" y2="32" stroke="hsl(185, 100%, 50%)" stroke-width="2"></line>
  <line x1="32" y1="46" x2="32" y2="50" stroke="hsl(185, 100%, 50%)" stroke-width="2"></line>
  <line x1="18" y1="32" x2="14" y2="32" stroke="hsl(185, 100%, 50%)" stroke-width="2"></line>
</svg>